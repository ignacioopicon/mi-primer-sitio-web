<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Sitio Web Multi-Página</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos básicos para la barra de navegación */
        nav {
            background-color: #1e293b;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        nav a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
            margin-right: 15px;
            padding: 6px 12px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        nav a:hover {
            background-color: #334155;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <!-- Barra de Navegación -->
    <nav>
        <a href="index.html">🏠 Inicio</a>
        <a href="proyectos.html">🚀 Mis Proyectos</a>
    </nav>

    <h1>Bienvenido a mi Sitio Web Multi-Página 🌐</h1>
    <p>Ahora mi sitio cuenta con diferentes secciones conectadas entre sí.</p>
</body>
</html>
